[project]
name = "mmtools"
version = "1.0.0"
description = "mmtools"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
    "License :: OSI Approved :: ISC License (ISCL)"
]

authors = [
    {name = "Fredrik Borg", email = "fredrikb.borg@gmail.com"}
]

readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "caep >= 1.7.0,<2",
    "dbus-python == 1.3.2",
    "mattermostdriver == 7.3.*",
    "notify2 == 0.3.*",
    "passpy == 1.0.2",
    "requests == 2.32.*",
    "websockets >= 14,<18",
]

[project.urls]
Homepage = "https://github.com/frbor/mmtools"

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "prek>=0.4.5,<1",
    "pytest>=8.4.2,<9",
    "ruff>=0.13.3,<1",
    "types-requests",
    "types-passpy",
    "types-setuptools",
]


[project.scripts]
mmstatus = "mmtools.status:i3blocks"
mmpolybar = "mmtools.status:polybar"
mmwaybar = "mmtools.status:waybar"
mmwatch = "mmtools.watch:main"
mmconfig = "mmtools.config:main"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",   # Builtins
    "E",   # pycodestyle
    "W",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "PTH", # Pathlib
    "I",   # isort
]

ignore = [
    "E501",   # Ignore long lines - handled by ruff format
    "B019",   # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
]

[tool.mypy]
strict = true
plugins = "pydantic.mypy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
